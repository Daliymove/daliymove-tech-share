name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      npm_config_registry: https://registry.npmjs.org/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          # Corepack prepares the pinned pnpm version in the next step.
          # Disable setup-node's implicit pnpm cache discovery until then.
          package-manager-cache: false

      # Node 22 includes Corepack. Enable its pnpm shim so lifecycle scripts
      # use the pinned version without relying on the older setup action's Node.js 20 runtime.
      - name: Prepare pnpm
        run: |
          # Make the pinned Corepack package manager available to lifecycle scripts,
          # not only to commands invoked as `corepack pnpm`.
          corepack enable pnpm
          corepack prepare pnpm@10.18.3 --activate
          pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --registry https://registry.npmjs.org/

      # Keep known moderate/high advisories visible until the locked package
      # updates can be applied, without blocking the Pages deployment.
      - name: Report dependency advisories
        continue-on-error: true
        run: corepack pnpm run audit:report

      - name: Block critical dependency advisories
        run: corepack pnpm run audit

      - name: Check content SEO
        run: corepack pnpm content:seo

      - name: Build site
        run: corepack pnpm build

      - name: Check Lighthouse performance budget
        run: corepack pnpm test:lighthouse

      - name: Check internal links
        run: corepack pnpm links

      - name: Check site contracts
        run: corepack pnpm contracts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
