name: Validate site

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Pull-request validation never receives deployment or repository-write scopes.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_registry: https://registry.npmjs.org/
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          # Corepack prepares the pinned pnpm version in the next step.
          # Disable setup-node's implicit pnpm cache discovery until then.
          package-manager-cache: false

      - name: Prepare pnpm
        run: |
          # Make the pinned Corepack package manager available to lifecycle scripts,
          # not only to commands invoked as `corepack pnpm`.
          corepack enable pnpm
          corepack prepare pnpm@10.18.3 --activate
          pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --registry https://registry.npmjs.org/

      # Keep known moderate/high advisories visible until the locked package
      # updates can be applied, without blocking pull-request validation.
      - name: Report dependency advisories
        continue-on-error: true
        run: corepack pnpm run audit:report

      - name: Block critical dependency advisories
        run: corepack pnpm run audit

      - name: Check content SEO
        run: corepack pnpm content:seo

      - name: Build site
        run: corepack pnpm build

      - name: Install Chromium for quality checks
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run Playwright and axe smoke checks
        run: corepack pnpm test:e2e

      - name: Check Lighthouse performance budget
        run: corepack pnpm test:lighthouse

      - name: Check internal links
        run: corepack pnpm links

      - name: Check site contracts
        run: corepack pnpm contracts
